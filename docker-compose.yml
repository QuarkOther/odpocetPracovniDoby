services:
  odpocet:
    build: .
    container_name: odpocet-pracovni-doby
    expose:
      - "13400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:13400/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: odpocet-nginx
    depends_on:
      - odpocet
    ports:
      # host:13400 -> nginx:80. Na tuto adresu (192.0.2.10:13400) míří Cloudflare Tunnel.
      - "13400:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    restart: unless-stopped
