services:
  odpocet:
    build: .
    container_name: odpocet-pracovni-doby
    expose:
      - "13400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:13400/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: odpocet-nginx
    depends_on:
      - odpocet
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: odpocet-cloudflared
    command: tunnel --no-autoupdate run
    depends_on:
      - nginx
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
