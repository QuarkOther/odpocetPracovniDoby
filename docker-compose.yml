services:
  mysql:
    image: mysql:8.4
    container_name: odpocet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: odpocet
      MYSQL_USER: odpocet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  odpocet:
    build: .
    container_name: odpocet-pracovni-doby
    expose:
      - "13400"
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: odpocet
      MYSQL_USER: odpocet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:13400/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: odpocet-nginx
    depends_on:
      - odpocet
    ports:
      # host BIND_ADDRESS:13400 -> nginx:80. Adresa se nastavuje v .env (výchozí
      # 127.0.0.1 = dostupné jen z localhostu). Na tuto adresu míří Cloudflare Tunnel.
      - "${BIND_ADDRESS:-127.0.0.1}:13400:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    restart: unless-stopped

volumes:
  mysql-data:
